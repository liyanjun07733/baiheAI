  <script>
  (()=>{

    let db=load(),module='dashboard',search='',qualityViewId='';
    function migrate(data){const d=data||{};for(const k of ['products','boms','orders','materialReceipts','finishedReceipts','pendingShipments','finishedShipments','adjustments','inspectionStandards','specialInspectionStandards','qualityReports','activity'])if(!Array.isArray(d[k]))d[k]=[];return d}
    function load(){
      if(READ_ONLY_WEB)return migrate(deep(window.MATERIAL_SYSTEM_SEED||{}));
      if(DESKTOP_MODE){try{const result=window.materialDesktop.loadData();if(!result?.ok)throw new Error(result?.error||'无法读取本机数据');if(result.data){const parsed=JSON.parse(result.data);if(parsed?.__loadError)throw new Error(parsed.__loadError);return migrate(parsed)}}catch(error){STORAGE_LOAD_FAILED=true;alert('本机数据库读取失败：'+error.message+'\n为保护原文件，本次不会覆盖写入。请从AutoBackups恢复。')}}

    }
    function save(){

        }

      }
      try{if(STORAGE_LOAD_FAILED)throw new Error('原数据文件读取失败，保护模式已阻止覆盖写入');const raw=JSON.stringify(db);if(DESKTOP_MODE){const result=window.materialDesktop.saveData(raw);if(!result?.ok)throw new Error(result?.error||'本机数据库写入失败')}else localStorage.setItem(STORE_KEY,raw)}

    }
    function log(text){db.activity=db.activity||[];db.activity.unshift({time:new Date().toLocaleString('zh-CN'),text});db.activity=db.activity.slice(0,40)}
    function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
    function product(code){return (db.products||[]).find(x=>x.code===String(code))}
    function productBoms(code){return (db.boms||[]).filter(x=>x.productCode===String(code))}
    function groupedUsage(code){const map=new Map();for(const b of productBoms(code)){const key=b.stockKey||b.materialCode;map.set(key,(map.get(key)||0)+num(b.usageQty))}return map}
    function finishedMap(excludeId=''){const m=new Map();for(const r of db.finishedReceipts||[]){if(r.id===excludeId)continue;const k=`${r.orderNo}|${r.productCode}`;m.set(k,(m.get(k)||0)+num(r.qty))}return m}
    function shipmentStatus(r){return r?.status==='已撤销'?'已撤销':'已出库'}
    function finishedShipmentMap(){const m=new Map();for(const r of db.finishedShipments||[]){if(shipmentStatus(r)==='已撤销')continue;const k=`${r.orderNo}|${r.productCode}`;m.set(k,(m.get(k)||0)+num(r.qty))}return m}
    function pendingShipmentMap(excludeId=''){const m=new Map();for(const r of db.pendingShipments||[]){if(r.id===excludeId)continue;const k=`${r.orderNo}|${r.productCode}`;m.set(k,(m.get(k)||0)+num(r.qty))}return m}
    function finishedStockRows(){
      const received=new Map(),shipped=finishedShipmentMap(),pending=pendingShipmentMap();
      for(const r of db.finishedReceipts||[]){const k=`${r.orderNo}|${r.productCode}`;if(!received.has(k))received.set(k,{key:k,orderNo:r.orderNo,productCode:r.productCode,productName:r.productName||product(r.productCode)?.name||'',receivedQty:0,lastReceiptDate:r.date||''});const x=received.get(k);x.receivedQty+=num(r.qty);if(String(r.date||'')>String(x.lastReceiptDate||''))x.lastReceiptDate=r.date||''}
      return [...received.values()].map(x=>{const order=(db.orders||[]).find(o=>o.orderNo===x.orderNo&&o.productCode===x.productCode),shippedQty=num(shipped.get(x.key)),pendingQty=num(pending.get(x.key)),availableQty=x.receivedQty-shippedQty,orderQty=num(order?.orderQty),orderUnshipped=orderQty>0?Math.max(orderQty-shippedQty,0):Math.max(availableQty,0),suggestedQty=Math.max(0,orderQty>0?Math.min(Math.max(availableQty,0),orderUnshipped):Math.max(availableQty,0)),importableQty=Math.max(0,suggestedQty-pendingQty);return{...x,productName:x.productName||product(x.productCode)?.name||'',orderQty,shippedQty,pendingQty,availableQty,importableQty,status:availableQty>0?'有库存':'已出完'}}).sort((a,b)=>String(b.lastReceiptDate).localeCompare(String(a.lastReceiptDate))||String(a.orderNo).localeCompare(String(b.orderNo),'zh-CN'))
    }
    function stockMasters(){const map=new Map();for(const b of db.boms||[]){const key=b.stockKey||b.materialCode;if(!map.has(key))map.set(key,{stockKey:key,materialName:b.materialName,attribute:b.attribute,codes:new Set(),products:new Set()});const x=map.get(key);x.codes.add(b.materialCode);x.products.add(b.productCode);if(b.attribute==='公用件')x.attribute='公用件'}return [...map.values()].map(x=>({...x,codes:[...x.codes],products:[...x.products]}))}
    function materialStats(excludeFinishedId=''){const masters=stockMasters(),received=new Map(),used=new Map(),adjusted=new Map(),demand=new Map();for(const r of db.materialReceipts||[])received.set(r.stockKey,(received.get(r.stockKey)||0)+num(r.qty));for(const r of db.finishedReceipts||[]){if(r.id===excludeFinishedId)continue;for(const [key,usage] of groupedUsage(r.productCode))used.set(key,(used.get(key)||0)+num(r.qty)*usage)}for(const a of db.adjustments||[])adjusted.set(a.stockKey,(adjusted.get(a.stockKey)||0)+num(a.impact));const fm=finishedMap(excludeFinishedId);for(const o of db.orders||[]){const remain=Math.max(num(o.orderQty)-num(fm.get(orderKey(o))),0);for(const [key,usage] of groupedUsage(o.productCode))demand.set(key,(demand.get(key)||0)+remain*usage)}return masters.map(m=>{const totalIn=num(received.get(m.stockKey)),totalUsed=num(used.get(m.stockKey)),adjustment=num(adjusted.get(m.stockKey)),onHand=totalIn-totalUsed+adjustment,need=num(demand.get(m.stockKey)),shortage=Math.max(need-onHand,0);return{...m,totalIn,totalUsed,adjustment,onHand,demand:need,shortage,status:onHand<0?'负库存':shortage>0?'缺料':'正常'}})}
    function statMap(excludeFinishedId=''){return new Map(materialStats(excludeFinishedId).map(x=>[x.stockKey,x]))}
    function orderCalculations(excludeFinishedId=''){const fm=finishedMap(excludeFinishedId),stocks=statMap(excludeFinishedId),available=new Map([...stocks].map(([k,v])=>[k,num(v.onHand)]));const source=(db.orders||[]).map((o,index)=>({...o,_index:index})).sort((a,b)=>num(a.priority)-num(b.priority)||a._index-b._index);const result=[];for(const o of source){const finished=num(fm.get(orderKey(o))),remaining=Math.max(num(o.orderQty)-finished,0),bom=productBoms(o.productCode),usage=groupedUsage(o.productCode);let can=0,missing=0,anomaly='';if(finished>num(o.orderQty))anomaly='成品入库超订单';else if(!(db.products||[]).some(p=>p.code===o.productCode))anomaly='成品资料缺失';else if(remaining>0&&!bom.length)anomaly='未完成订单未建BOM';if(remaining===0)can=0;else if(usage.size){let cap=Infinity;for(const [key,u] of usage){const stock=Math.max(num(available.get(key)),0);cap=Math.min(cap,Math.floor(stock/u));if(stock<remaining*u)missing++}can=Math.max(0,Math.min(remaining,Number.isFinite(cap)?cap:0));for(const [key,u] of usage)available.set(key,num(available.get(key))-can*u)}const status=anomaly?'异常':remaining===0?'已完成':can>=remaining?'物料可完成':'缺料';result.push({...o,finished,remaining,canProduce:can,missingCount:missing,status,anomaly})}return result.sort((a,b)=>a._index-b._index)}
    function orderCalc(id,excludeFinishedId=''){return orderCalculations(excludeFinishedId).find(x=>x.id===id)}
    function standardsFor(code){const own=(db.inspectionStandards||[]).filter(x=>x.productCode===String(code));return own.length?own:DEFAULT_INSPECTION_ITEMS.map((x,i)=>({id:`DEFAULT-${i}`,productCode:String(code),...x}))}
    function specialStandardsFor(code){return (db.specialInspectionStandards||[]).filter(x=>x.productCode===String(code))}
    function addDefaultStandards(code){const existing=new Set((db.inspectionStandards||[]).filter(x=>x.productCode===code).map(x=>x.item));let added=0;for(const x of DEFAULT_INSPECTION_ITEMS){if(existing.has(x.item))continue;db.inspectionStandards.push({id:uid('QS'),productCode:code,...deep(x)});added++}return added}
    function normalizeSampleMode(mode,fallback='MAIN'){const v=String(mode||fallback).toUpperCase();return ['MAIN','S-1','S-2','S-3','S-4','FIXED'].includes(v)?v:fallback}
    function sampleRuleLabel(mode,fixedQty=0){const m=normalizeSampleMode(mode);if(m==='MAIN')return'跟随主AQL样本';if(m==='FIXED')return'固定 '+fmt(fixedQty||1)+' pcs';return m+' 特殊水平（最低3pcs）'}

    function reportsForOrder(o){return (db.qualityReports||[]).filter(x=>x.orderNo===o.orderNo&&x.productCode===o.productCode)}
    function orderQualitySummary(o,excludeFinishedId=''){const reports=reportsForOrder(o),accepted=reports.filter(x=>x.result==='合格'||x.result==='让步接收').reduce((a,x)=>a+num(x.passedQty),0),inspected=reports.reduce((a,x)=>a+num(x.lotQty),0),finished=num(finishedMap(excludeFinishedId).get(orderKey(o))),available=Math.max(accepted-finished,0),latest=reports.slice().sort((a,b)=>String(b.inspectionDate).localeCompare(String(a.inspectionDate)))[0];return{reports,accepted,inspected,finished,available,latest,status:!reports.length?'未验货':latest?.result||'待处理'}}

    function render(){if(module==='dashboard')return renderDashboard();if(module==='orders')return renderOrders();if(module==='materialReceipts')return renderMaterialReceipts();if(module==='qualityReports')return renderQualityReports();if(module==='finishedReceipts')return renderFinishedReceipts();if(module==='pendingShipments')return renderPendingShipments();if(module==='finishedShipments')return renderFinishedShipments();if(module==='inventory')return renderInventory();if(module==='adjustments')return renderAdjustments();if(module==='query')return renderQuery();if(module==='products')return renderProducts();if(module==='boms')return renderBoms();if(module==='qualityStandards')return renderQualityStandards();renderSettings()}

    function renderDashboard(){const orders=orderCalculations(),stats=materialStats(),incomplete=orders.reduce((a,x)=>a+x.remaining,0),shortOrders=orders.filter(x=>x.status==='缺料'||x.status==='异常').length,ready=orders.filter(x=>x.status==='物料可完成').length,totalFinished=(db.finishedReceipts||[]).reduce((a,x)=>a+num(x.qty),0),totalShipped=(db.finishedShipments||[]).filter(x=>shipmentStatus(x)==='已出库').reduce((a,x)=>a+num(x.qty),0),finishedOnHand=finishedStockRows().reduce((a,x)=>a+Math.max(num(x.availableQty),0),0),shortages=stats.filter(x=>x.shortage>0).sort((a,b)=>b.shortage-a.shortage).slice(0,8);pageHead('首页看板','根据订单、BOM、配件入库和成品入库实时核算',`<button class="btn primary" id="dashOrder">＋ 新增订单</button><button class="btn" id="dashBatch">批量配件入库</button><button class="btn" id="dashFinished">成品入库</button>`);document.getElementById('content').innerHTML=`<div class="cards"><div class="card"><div class="label">订单总数</div><div class="value">${orders.length}</div><div class="sub">已完成 ${orders.filter(x=>x.status==='已完成').length} 张</div></div><div class="card"><div class="label">未完成成品数量</div><div class="value">${fmt(incomplete)}</div><div class="sub">物料可完成 ${ready} 张订单</div></div><div class="card"><div class="label">缺料/异常订单</div><div class="value danger-text">${shortOrders}</div><div class="sub">需要优先处理</div></div><div class="card"><div class="label">当前成品库存</div><div class="value">${fmt(finishedOnHand)}</div><div class="sub">累计入库 ${fmt(totalFinished)} · 已出库 ${fmt(totalShipped)}</div></div></div><div class="dash-grid"><div class="box"><h3>缺口最大的物料 TOP 8</h3>${shortages.length?`<ul class="shortage-list">${shortages.map(x=>`<li><span><b>${esc(x.stockKey)}</b>　${esc(x.materialName)} <small>(${esc(x.attribute)})</small></span><b>缺 ${fmt(x.shortage)}</b></li>`).join('')}</ul>`:'<div class="empty">当前没有缺料</div>'}</div><div class="box"><h3>订单状态</h3>${['已完成','物料可完成','缺料','异常'].map(s=>{const n=orders.filter(x=>x.status===s).length,p=orders.length?Math.round(n/orders.length*100):0;return `<div clas     function renderPendingShipments(){

    function updatePendingQty(id,value,input){
      const rec=(db.pendingShipments||[]).find(x=>x.id===id);if(!rec)return;const qty=num(value),stock=finishedStockRows().find(x=>x.key===`${rec.orderNo}|${rec.productCode}`),available=num(stock?.availableQty);

    function removePendingShipment(id){

    function openPendingImport(){
      const stocks=finishedStockRows().filter(x=>x.availableQty>0),existing=new Set((db.pendingShipments||[]).map(x=>`${x.orderNo}|${x.productCode}`));
      if(!stocks.length)return alert('当前没有可出库的成品库存。请先完成成品入库。');
      const body=`<div class="callout"><b>可一次选择多个订单。</b> 搜索支持订单号、成品货号、成品名称；也可以用空格、逗号分隔多个关键词。导入数量默认按当前可出库数量带入，导入后可在“待出库数量”中自行修改。</div><div class="filters" style="border:1px solid #d5dfe5;border-radius:5px;margin-bottom:8px"><input id="stockImportSearch" type="search" placeholder="例如：7388276 7409959 或 59689" style="width:min(560px,100%)"><span class="count" id="stockImportCount"></span></div><div class="table-wrap" style="max-height:470px"><table id="stockImportTable"><thead><tr><th>选择</th><th>订单号</th><th>成品货号</th><th>成品名称</th><th>订单数量</th><th>累计入库</th><th>已出库</th><th>当前库存</th><th>默认导入</th></tr></thead><tbody></tbody></table></div>`;
      showModal('从成品库导入待出库',body,()=>{
        const checked=[...document.querySelectorAll('#stockImportTable tbody input[type=checkbox]:checked')];if(!checked.length)return alert('请至少选择一个订单。');let added=0,skipped=0;
        for(const cb of checked){const x=stocks[Number(cb.dataset.stockIndex)];if(!x)continue;const key=x.key;if((db.pendingShipments||[]).some(r=>`${r.orderNo}|${r.productCode}`===key)){skipped++;continue}const qty=Math.max(0,num(x.importableQty));if(qty<=0){skipped++;continue}db.pendingShipments.push({id:uid('PS'),createdDate:today(),orderNo:x.orderNo,productCode:x.productCode,productName:x.productName,qty,sourceAvailableQty:x.availableQty,remark:''});added++}

    function nextShipmentBatchNo(date=today()){const prefix='OUT-'+String(date||today()).replaceAll('-','')+'-';const nums=(db.finishedShipments||[]).map(x=>String(x.batchNo||'')).filter(x=>x.startsWith(prefix)).map(x=>num(x.slice(prefix.length))).filter(Boolean);return prefix+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0')}

    function shipSelectedPending(){
      const set=selectedByModule.pendingShipments||(selectedByModule.pendingShipments=new Set()),picked=(db.pendingShipments||[]).filter(x=>set.has(x.id));if(!picked.length)return alert('请先勾选需要正式出库的待出库记录。');

    function renderQualityReports(){

    function openQualityReport(id='',presetOrderId=''){
      const rec=(db.qualityReports||[]).find(x=>x.id===id),order=rec?(db.orders||[]).find(o=>o.orderNo===rec.orderNo&&o.productCode===rec.productCode):(db.orders||[]).find(o=>o.id===presetOrderId);
      if(!order)return alert('找不到对应订单');
      const calc=orderCalc(order.id),items=deep(rec?.items||standardsFor(order.productCode).map(x=>({item:x.item,standard:x.standard,method:x.method,sampleQty:x.defaultSample,defectQty:0,result:'合格',remark:''}))),reportNo=rec?.reportNo||nextReportNo();
      let photos=deep(rec?.photos||[]),photoBusy=false;
      const body=`<div class="callout">报告会自动关联订单和成品。黄色区域可填写；各检验项目来自“成品检验标准”，本报告中仍可单独修改。</div><div class="form-grid">${field('报告编号','reportNo',reportNo,'text','readonly')}${field('检验日期 <span class="required">*</span>','inspectionDate',rec?.inspectionDate||today(),'date','required')}${field('订单号','orderNo',order.orderNo,'text','readonly')}${field('成品货号 / 名称','productDisplay',`${order.productCode}　${product(order.productCode)?.name||''}`,'text','readonly')}${field('检验批次','lotNo',rec?.lotNo||order.orderNo)}${field('检验员 <span class="required">*</span>','inspector',rec?.inspector||'','text','required')}${field('复核人','reviewer',rec?.reviewer||'')}${field('抽样依据','samplingStandard',rec?.samplingStandard||'内部抽样 / 客户要求')}${field('检验批数量 <span class="required">*</span>','lotQty',rec?.lotQty||calc?.remaining||order.orderQty,'number','min="1" step="any" required')}${field('抽样数量 <span class="required">*</span>','sampleQty',rec?.sampleQty||Math.min(5,num(order.orderQty)),'number','min="1" step="any" required')}${field('样本缺陷数量','defectQty',rec?.defectQty||0,'number','min="0" step="any"')}${field('本报告放行数量','passedQty',rec?.passedQty??(calc?.remaining||order.orderQty),'number','min="0" step="any"')}${selectField('最终结论','result',[['合格','合格'],['部分合格','部分合格'],['不合格','不合格'],['让步接收','让步接收'],['待处理','待处理']],rec?.result||'合格')}${textArea('总体说明 / 不良描述','remark',rec?.remark||'')} </div><h3 style="margin:18px 0 8px">检验项目</h3><div class="table-wrap" style="max-height:330px"><table><thead><tr><th>项目</th><th>检验标准</th><th>方法</th><th>抽样数</th><th>缺陷数</th><th>结果</th><th>备注</th></tr></thead><tbody>${items.map((x,i)=>`<tr class="quality-item-row" data-quality-item="${i}"><td><input name="item" value="${esc(x.item)}"></td><td><input name="standard" value="${esc(x.standard)}"></td><td><input name="method" value="${esc(x.method)}"></td><td><input name="itemSampleQty" type="number" min="0" value="${esc(x.sampleQty)}"></td><td><input name="itemDefectQty" type="number" min="0" value="${esc(x.defectQty)}"></td><td><select name="itemResult"><option ${x.result==='合格'?'selected':''}>合格</option><option ${x.result==='不合格'?'selected':''}>不合格</option><option ${x.result==='待确认'?'selected':''}>待确认</option></select></td><td><input name="itemRemark" value="${esc(x.remark)}"></td></tr>`).join('')}</tbody></table></div><div class="callout" style="margin-top:14px"><b>现场照片（最多4张）</b>　系统会自动压缩后保存在本机备份中。<input id="qualityPhotos" type="file" accept="image/*" multiple style="margin-left:10px"><div id="qualityPhotoPreview" class="photo-grid"></div></div>`;
      showModal(id?'编辑成品验货报告':'生成成品验货报告',body,(data,form)=>{
        if(photoBusy)return alert('照片正在处理，请稍候再保存');
        const lotQty=num(data.get('lotQty')),sampleQty=num(data.get('sampleQty')),passedQty=num(data.get('passedQty')),defectQty=num(data.get('defectQty')),result=String(data.get('result'));
        if(lotQty<=0||sampleQty<=0||!String(data.get('inspector')).trim())return alert('请填写检验批数量、抽样数量和检验员');
        if(sampleQty>lotQty)return alert('抽样数量不能大于检验批数量');
        if(passedQty<0||passedQty>lotQty)return alert('放行数量必须在0到检验批数量之间');
        if((result==='合格'||result==='让步接收')&&passedQty<=0)return alert('合格或让步接收的报告必须填写放行数量');
        const reportItems=[...form.querySelectorAll('[data-quality-item]')].map(row=>({item:row.querySelector('[name=item]').value.trim(),standard:row.querySelector('[name=standard]').value.trim(),method:row.querySelector('[name=method]').value.trim(),sampleQty:num(row.querySelector('[name=itemSampleQty]').value),defectQty:num(row.querySelector('[name=itemDefectQty]').value),result:row.querySelector('[name=itemResult]').value,remark:row.querySelector('[name=itemRemark]').value.trim()})).filter(x=>x.item);
        if(!reportItems.length)return alert('至少需要一个检验项目');

      document.getElementById('qualityPhotos').onchange=async e=>{const files=[...e.target.files].slice(0,Math.max(0,4-photos.length));if(!files.length)return;photoBusy=true;e.target.disabled=true;try{for(const f of files)photos.push({name:f.name,data:await compressImage(f)})}catch(err){alert('照片处理失败：'+err.message)}finally{photoBusy=false;e.target.disabled=false;e.target.value='';drawPhotos()}};
    }

    function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('无法读取照片'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('照片格式不支持'));img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}

    function isReadOnlyQueryControl(el){
      if(!el || !(el instanceof HTMLElement))return false;
      if(el.id==='search' || el.matches('input[type="search"]'))return true;
      if(el.closest('.filters'))return true;
      if(el.closest('.query-top') && !el.closest('form'))return true;
      if(el.closest('.query-product-search') && !el.closest('form'))return true;
      if(el.closest('.smart-picker') && !el.closest('#modal') && !el.closest('form'))return true;
      if(el.matches('input[type="checkbox"],input[type="radio"]') && !el.closest('#modal'))return true;
      return false;
    }

    function isReadOnlyAllowedButton(btn){

      return /(查询|搜索|筛选|查看|打印|保存PDF|保存为PDF|PDF|导出|下载|返回|物料|详情|预览|关闭|取消)/.test(text);
    }

    function enforceWebsiteReadOnly(){
      if(!READ_ONLY_WEB)return;

      // Every action inside the working area is hidden unless it is strictly a read/query/print/export action.
      [document.getElementById('pageHead'),document.getElementById('content'),document.getElementById('modal')]
        .filter(Boolean)
        .forEach(root=>{
          root.querySelectorAll('button').forEach(btn=>{
            if(isReadOnlyAllowedButton(btn)){
              btn.disabled=false;
              btn.style.display='';
              btn.style.opacity='';
              btn.style.cursor='';
              return;
            }
            btn.disabled=true;
            btn.style.display='none';
            btn.setAttribute('aria-hidden','true');
            btn.title='网站只读模式：此操作只能在桌面系统中完成';
          });

          root.querySelectorAll('input,select,textarea').forEach(el=>{
            if(isReadOnlyQueryControl(el)){
              el.disabled=false;
              if(el instanceof HTMLInputElement || el instanceof HTMLTextAreaElement) el.readOnly=false;
              el.style.pointerEvents='';
              el.style.opacity='';
              return;
            }

            if(el instanceof HTMLInputElement){
              if(el.type==='file'){
                el.disabled=true;
                el.style.display='none';
              }else if(el.type==='checkbox' || el.type==='radio'){
                el.disabled=true;
              }else{
                el.readOnly=true;
                el.setAttribute('aria-readonly','true');
              }
            }else{
              el.disabled=true;
            }
            el.style.cursor='default';
          });

          root.querySelectorAll('[contenteditable="true"]').forEach(el=>{
            el.setAttribute('contenteditable','false');
          });
        });

      const save=document.querySelector('#modalForm .save');
      if(save){save.disabled=true;save.style.display='none'}
    }

    function blockWebsiteEditEvent(e){
      if(!READ_ONLY_WEB)return;
      const el=e.target;
      if(!(el instanceof HTMLElement))return;
      if(!el.matches('input,select,textarea,[contenteditable]'))return;
      if(isReadOnlyQueryControl(el))return;
      e.preventDefault();
      e.stopImmediatePropagation();
    }

    ['beforeinput','paste','drop'].forEach(type=>{
